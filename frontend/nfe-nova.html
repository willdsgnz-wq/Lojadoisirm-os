<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1E3A8A">
    <link rel="manifest" href="/manifest.webmanifest?v=__ICON_VERSION__">
    <link rel="icon" href="/favicon.ico?v=__ICON_VERSION__" sizes="any" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico?v=__ICON_VERSION__" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png?v=__ICON_VERSION__">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png?v=__ICON_VERSION__">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png?v=__ICON_VERSION__">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=__ICON_VERSION__">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png?v=__ICON_VERSION__">
    <title>Material de Construção Dois Irmãos | Nova NF-e</title>
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body class="nfe-builder-page">
    <div class="nfe-builder-shell">
      <header class="nfe-builder-topbar">
        <div class="nfe-builder-topbar-left">
          <a href="/" class="btn btn-secondary">Voltar ao painel</a>
          <div class="nfe-builder-heading">
            <span class="eyebrow">NF-e independente</span>
            <h1>Nova NF-e</h1>
            <p>Monte a nota com cliente e itens reais do produto, sem depender da tela de vendas.</p>
          </div>
        </div>
        <div class="nfe-builder-topbar-right">
          <div class="user-chip">
            <span id="nfe-user-name">Carregando...</span>
            <small>Emissão manual e rápida</small>
          </div>
        </div>
      </header>

      <main id="nfe-builder-root" class="nfe-builder-root">
        <section class="panel">
          <div class="section-header">
            <div>
              <h3>Carregando página da NF-e</h3>
              <p>Buscando produtos, dados fiscais e preparando o formulário.</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/static/js/nfe-nova.js"></script>
  </body>
</html>
